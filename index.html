<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Direct Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

    /* Screens */
    .screen { display: none; flex-direction: column; height: 100%; width: 100%; max-width: 500px; margin: 0 auto; background: #1e293b; }
    .screen.active { display: flex; }

    /* Login Screen */
    #login-screen { justify-content: center; padding: 24px; gap: 16px; text-align: center; }
    #login-screen h1 { font-size: 1.75rem; color: #38bdf8; }
    #login-screen p { color: #94a3b8; font-size: 0.95rem; }
    input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { padding: 14px 20px; border-radius: 12px; border: none; background: #0284c7; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:active { background: #0369a1; }

    /* Header */
    .header { padding: 14px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .back-btn { background: none; padding: 4px 8px; font-size: 1.2rem; color: #38bdf8; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; display: inline-block; }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .sub-status { font-size: 0.78rem; color: #94a3b8; }

    /* Users List */
    .new-chat-box { padding: 12px 16px; display: flex; gap: 8px; border-bottom: 1px solid #334155; }
    .user-list { flex: 1; overflow-y: auto; padding: 8px 0; }
    .user-item { padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #33415555; cursor: pointer; }
    .user-item:active { background: #334155; }

    /* Messages Area */
    .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .msg.sent { align-self: flex-end; background: #0284c7; color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 4px; }
    .msg-time { font-size: 0.68rem; opacity: 0.7; margin-top: 4px; text-align: right; }

    /* Input Bar */
    .input-bar { padding: 10px 12px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    .input-bar input { border-radius: 20px; padding: 10px 16px; }
    .input-bar button { border-radius: 20px; padding: 10px 18px; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-screen" class="screen active">
    <h1>DirectChat</h1>
    <p>Pick a username to start 1-on-1 messaging</p>
    <input type="text" id="username-input" placeholder="Enter your username (e.g. alex)" maxlength="20" />
    <button onclick="login()">Enter Chat</button>
  </div>

  <!-- 2. CONTACTS / ACTIVE USERS SCREEN -->
  <div id="users-screen" class="screen">
    <div class="header">
      <div>
        <strong id="me-label"></strong>
        <div class="sub-status">Tap a user or enter a name below</div>
      </div>
      <button style="padding:6px 12px; font-size:0.8rem; background:#334155;" onclick="logout()">Logout</button>
    </div>
    <div class="new-chat-box">
      <input type="text" id="target-user-input" placeholder="Friend's exact username..." />
      <button onclick="startChatFromInput()">Chat</button>
    </div>
    <div class="user-list" id="user-list"></div>
  </div>

  <!-- 3. 1-ON-1 CHAT SCREEN -->
  <div id="chat-screen" class="screen">
    <div class="header">
      <div class="header-left">
        <button class="back-btn" onclick="goBack()">←</button>
        <div>
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="status-dot" id="peer-dot"></span>
            <strong id="peer-name"></strong>
          </div>
          <div class="sub-status" id="peer-status">Offline</div>
        </div>
      </div>
    </div>
    <div class="messages" id="messages"></div>
    <form class="input-bar" onsubmit="sendMessage(event)">
      <input type="text" id="msg-input" placeholder="Message..." autocomplete="off" oninput="handleTyping()" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Firebase SDK (v13.3.0 via gstatic CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, off, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyCW5mZPBh9wKxIUN8O50BzSkd_miytLIoU",
  authDomain: "my-direct-chat.firebaseapp.com",
  databaseURL: "https://my-direct-chat-default-rtdb.firebaseio.com",
  projectId: "my-direct-chat",
  storageBucket: "my-direct-chat.firebasestorage.app",
  messagingSenderId: "510476692856",
  appId: "1:510476692856:web:9563a912a73248df096c8d",
  measurementId: "G-KB9934HJHD"
};
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentUser = localStorage.getItem("chat_user") || "";
    let currentPeer = "";
    let currentRoomId = "";
    let messagesRef = null;
    let peerStatusRef = null;
    let typingRef = null;
    let typingTimeout = null;

    const cleanName = (str) => str.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    window.login = () => {
      const name = cleanName(document.getElementById("username-input").value);
      if (!name) return alert("Please enter a valid username (letters/numbers).");
      currentUser = name;
      localStorage.setItem("chat_user", name);
      initUserSession();
    };

    window.logout = () => {
      if (currentUser) set(ref(db, `users/${currentUser}/online`), false);
      localStorage.removeItem("chat_user");
      currentUser = "";
      showScreen("login-screen");
    };

    function initUserSession() {
      document.getElementById("me-label").textContent = `@${currentUser}`;
      showScreen("users-screen");

      const myStatusRef = ref(db, `users/${currentUser}`);
      set(myStatusRef, { online: true, lastSeen: serverTimestamp() });
      onDisconnect(ref(db, `users/${currentUser}/online`)).set(false);

      // Load user directory
      onValue(ref(db, "users"), (snap) => {
        const list = document.getElementById("user-list");
        list.innerHTML = "";
        const users = snap.val() || {};
        Object.keys(users).forEach((u) => {
          if (u === currentUser) return;
          const div = document.createElement("div");
          div.className = "user-item";
          div.innerHTML = `
            <span>@${u}</span>
            <span class="status-dot ${users[u].online ? "online" : ""}"></span>
          `;
          div.onclick = () => openChat(u);
          list.appendChild(div);
        });
      });
    }

    window.startChatFromInput = () => {
      const target = cleanName(document.getElementById("target-user-input").value);
      if (!target || target === currentUser) return alert("Enter a different valid username.");
      document.getElementById("target-user-input").value = "";
      openChat(target);
    };

    window.openChat = (peer) => {
      currentPeer = peer;
      currentRoomId = [currentUser, peer].sort().join("__");
      document.getElementById("peer-name").textContent = `@${peer}`;
      document.getElementById("messages").innerHTML = "";
      showScreen("chat-screen");

      // Watch peer online & typing status
      peerStatusRef = ref(db, `users/${peer}/online`);
      typingRef = ref(db, `typing/${currentRoomId}/${peer}`);

      let isPeerOnline = false;
      let isPeerTyping = false;

      const updateStatusText = () => {
        const dot = document.getElementById("peer-dot");
        const txt = document.getElementById("peer-status");
        dot.classList.toggle("online", isPeerOnline);
        if (isPeerTyping) txt.textContent = "typing...";
        else txt.textContent = isPeerOnline ? "Online" : "Offline";
      };

      onValue(peerStatusRef, (s) => { isPeerOnline = !!s.val(); updateStatusText(); });
      onValue(typingRef, (s) => { isPeerTyping = !!s.val(); updateStatusText(); });

      // Listen for 1-on-1 messages
      messagesRef = ref(db, `chats/${currentRoomId}`);
      onValue(messagesRef, (snap) => {
        const box = document.getElementById("messages");
        box.innerHTML = "";
        const msgs = snap.val() || {};
        Object.values(msgs).forEach((m) => {
          const div = document.createElement("div");
          div.className = `msg ${m.sender === currentUser ? "sent" : "received"}`;
          const time = m.ts ? new Date(m.ts).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
          div.innerHTML = `<div>${escapeHtml(m.text)}</div><div class="msg-time">${time}</div>`;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      });
    };

    window.sendMessage = (e) => {
      e.preventDefault();
      const input = document.getElementById("msg-input");
      const text = input.value.trim();
      if (!text || !currentRoomId) return;

      push(ref(db, `chats/${currentRoomId}`), {
        sender: currentUser,
        text,
        ts: Date.now()
      });

      set(ref(db, `typing/${currentRoomId}/${currentUser}`), false);
      input.value = "";
    };

    window.handleTyping = () => {
      if (!currentRoomId) return;
      const myTypingRef = ref(db, `typing/${currentRoomId}/${currentUser}`);
      set(myTypingRef, true);
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => set(myTypingRef, false), 1500);
    };

    window.goBack = () => {
      if (messagesRef) off(messagesRef);
      if (peerStatusRef) off(peerStatusRef);
      if (typingRef) off(typingRef);
      currentPeer = "";
      currentRoomId = "";
      showScreen("users-screen");
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    if (currentUser) initUserSession();
  </script>
</body>
</html>
